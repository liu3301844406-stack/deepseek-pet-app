<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DeepSeek大肥鱼</title>
<script src="capacitor.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#f0f4f8;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}
  #character{text-align:center;padding:10px;background:#fff;border-bottom:1px solid #ddd;flex:0 0 auto;position:relative}
  #character img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid #007bff;background:#eef}
  #settings-btn{position:absolute;top:8px;right:10px;background:#eef4ff;color:#007bff;border:1px solid #c9dcff;border-radius:14px;padding:4px 10px;font-size:13px;font-weight:bold}
  #chat-box{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
  .message{max-width:80%;padding:10px 15px;border-radius:15px;margin-bottom:10px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#007bff;color:#fff}
  .ai{align-self:flex-start;background:#fff;color:#333}
  .input-area{display:flex;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;flex:0 0 auto}
  #user-input{flex:1;padding:12px;border:1px solid #ccc;border-radius:20px;outline:none;font-size:16px}
  button{background:#007bff;color:#fff;border:none;border-radius:20px;padding:0 20px;margin-left:10px;font-weight:bold;font-size:15px}
  #modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  #modal-mask.show{display:flex}
  #modal{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #modal h3{margin:0 0 10px;font-size:16px;color:#333}
  #modal p{margin:0 0 10px;font-size:13px;color:#888}
  #key-input{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;outline:none;font-size:14px;margin-bottom:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .modal-actions button{margin-left:0;padding:8px 16px;font-size:14px;border-radius:10px}
  .btn-ghost{background:#eef;color:#333}
  .btn-danger{background:#ff5b5b}
  body.pet-mode{background:transparent;height:auto}
  body.pet-mode #chat-box,body.pet-mode .input-area,body.pet-mode #settings-btn{display:none}
  body.pet-mode #character{padding:0;background:transparent;border:none}
  body.pet-mode #character img{width:160px;height:160px;border-width:3px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
  <div id="character">
    <img id="avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="大肥鱼">
    <button id="settings-btn" type="button">⚙️ 设置</button>
  </div>
  <div id="chat-box"></div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="对她说点什么..." enterkeyhint="send" autocomplete="off">
    <button id="send-btn">发送</button>
  </div>
  <div id="modal-mask">
    <div id="modal">
      <h3>设置</h3>
      <p>Key 只保存在本地。请填写 DeepSeek API Key。</p>
      <input type="password" id="key-input" placeholder="sk-..." autocomplete="off">
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-key">取消</button>
        <button id="save-key">保存</button>
      </div>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn-ghost" id="enable-pet" style="flex:1;">🐟 开启桌宠悬浮窗</button>
        <button class="btn-ghost" id="collapse-pet" style="flex:1;display:none;">缩回桌宠</button>
      </div>
    </div>
  </div>
<script>
  const CONFIG = { API_URL: 'https://api.deepseek.com/chat/completions' };
  const SYSTEM = '你是一个可爱的二次元女仆，头上顶着一个不锈钢盆。请用简短、可爱、傲娇的语气回答。';
  const KEY_STORAGE = 'deepseek_api_key', CHAT_STORAGE = 'deepseek_chat_logs';
  const chatBox = document.getElementById('chat-box'), input = document.getElementById('user-input'), btn = document.getElementById('send-btn'), modalMask = document.getElementById('modal-mask'), keyInput = document.getElementById('key-input');
  let history = [{role: 'system', content: SYSTEM}], busy = false;
  
  function getKey() { return localStorage.getItem(KEY_STORAGE) || ''; }
  function appendMessage(role, text) { 
    const div = document.createElement('div'); 
    div.className = 'message ' + (role === 'user' ? 'user' : 'ai'); 
    div.textContent = text; chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight; 
    return div; 
  }
  
  function openSettings() { keyInput.value = getKey(); modalMask.classList.add('show'); }
  function closeSettings() { modalMask.classList.remove('show'); }
  
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('cancel-key').addEventListener('click', closeSettings);
  document.getElementById('save-key').addEventListener('click', () => { 
    localStorage.setItem(KEY_STORAGE, keyInput.value.trim()); 
    closeSettings(); 
    appendMessage('ai', 'Key 已保存。'); 
  });
  
  modalMask.addEventListener('click', e => { if(e.target === modalMask) closeSettings(); });
  
  const isPetMode = new URLSearchParams(location.search).get('mode') === 'pet';
  if (isPetMode) {
    document.body.classList.add('pet-mode');
    document.getElementById('enable-pet').style.display = 'none';
    document.getElementById('collapse-pet').style.display = 'inline-block';
    document.getElementById('avatar').addEventListener('click', () => {
      if (window.Capacitor?.Plugins?.DesktopPet) Capacitor.Plugins.DesktopPet.expand();
    });
  } else {
    document.getElementById('enable-pet').addEventListener('click', async () => {
      if (window.Capacitor?.Plugins?.DesktopPet) {
        try { await Capacitor.Plugins.DesktopPet.enter(); closeSettings(); } 
        catch(e) { alert('开启失败，请检查权限'); }
      } else { alert('需在 APP 中使用'); }
    });
  }
  document.getElementById('collapse-pet').addEventListener('click', () => {
    if (window.Capacitor?.Plugins?.DesktopPet) Capacitor.Plugins.DesktopPet.collapse();
  });

  async function sendMessage() {
    if (busy) return; 
    const text = input.value.trim(); 
    if (!text) return;
    if (!getKey()) { appendMessage('ai', '先点右上角设置填 Key 哦'); openSettings(); return; }
    
    input.value = ''; appendMessage('user', text); history.push({role: 'user', content: text});
    busy = true; btn.disabled = true; const loading = appendMessage('ai', '思考中...🍲');
    
    try {
      const res = await fetch(CONFIG.API_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getKey() }, 
        body: JSON.stringify({ model: 'deepseek-chat', messages: history, temperature: 1.3 }) 
      });
      if (!res.ok) throw new Error();
      const data = await res.json(); 
      const reply = (data?.choices?.[0]?.message?.content || '').trim() || '（没说话）';
      loading.textContent = reply; history.push({role: 'assistant', content: reply});
      if (history.length > 41) history = [history[0], ...history.slice(-40)];
      localStorage.setItem(CHAT_STORAGE, JSON.stringify(history.filter(m => m.role !== 'system')));
    } catch (e) { 
      loading.textContent = '连接失败，请检查 Key 和网络。'; history.pop(); 
    } finally { 
      busy = false; btn.disabled = false; chatBox.scrollTop = chatBox.scrollHeight; 
    }
  }
  
  btn.addEventListener('click', sendMessage); 
  input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
  
  appendMessage('ai', 'DeepSeek大肥鱼。请问有什么可以帮你的？');
</script>
</body>
</html>
