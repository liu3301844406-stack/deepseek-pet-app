<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DeepSeek大肥鱼</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}
  #character{text-align:center;padding:10px;background:#fff;border-bottom:1px solid #ddd;flex:0 0 auto;position:relative}
  #character img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid #007bff;background:#eef}
  #settings-btn{position:absolute;top:8px;right:10px;background:#eef4ff;color:#007bff;border:1px solid #c9dcff;border-radius:14px;padding:4px 10px;font-size:13px;font-weight:bold}
  #chat-box{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
  .message{max-width:80%;padding:10px 15px;border-radius:15px;margin-bottom:10px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#007bff;color:#fff}
  .ai{align-self:flex-start;background:#fff;color:#333}
  .input-area{display:flex;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;flex:0 0 auto}
  #user-input{flex:1;padding:12px;border:1px solid #ccc;border-radius:20px;outline:none;font-size:16px}
  button{background:#007bff;color:#fff;border:none;border-radius:20px;padding:0 20px;margin-left:10px;font-weight:bold;font-size:15px}
  button:disabled{opacity:.5}
  #modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  #modal-mask.show{display:flex}
  #modal{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #modal h3{margin:0 0 10px;font-size:16px;color:#333}
  #modal p{margin:0 0 10px;font-size:13px;color:#888;line-height:1.5}
  #key-input{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;outline:none;font-size:14px;margin-bottom:12px}
  #backup-info{background:#f5f8ff;color:#4a6fa5;border-radius:10px;padding:8px 10px;margin-bottom:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .modal-actions button{margin-left:0;padding:8px 16px;font-size:14px;border-radius:10px}
  .btn-ghost{background:#eef;color:#333}
  .btn-danger{background:#ff5b5b}
  body.pet-mode{background:transparent;height:auto}
  body.pet-mode #chat-box,body.pet-mode .input-area,body.pet-mode #settings-btn{display:none}
  body.pet-mode #character{padding:0;background:transparent;border:none}
  body.pet-mode #character img{width:160px;height:160px;border-width:3px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  body.chat-mode{background:#f0f4f8}
</style>
</head>
<body>
  <div id="character">
    <img id="avatar" src="这里填图片地址或base64" alt="DeepSeek大肥鱼">
    <button id="settings-btn" type="button">⚙️ 设置</button>
  </div>
  <div id="chat-box"></div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="对她说点什么..." enterkeyhint="send" autocomplete="off">
    <button id="send-btn">发送</button>
  </div>
  <div id="modal-mask">
    <div id="modal">
      <h3>设置</h3>
      <p>Key 只保存在你的手机本地。请填写你自己的 DeepSeek API Key（sk- 开头）。</p>
      <input type="password" id="key-input" placeholder="sk-..." autocomplete="off">
      <p id="backup-info">本地已备份 0 条消息</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="clear-key">清除 Key</button>
        <button class="btn-danger" id="clear-chat">清空对话</button>
        <button class="btn-ghost" id="cancel-key">取消</button>
        <button id="save-key">保存</button>
      </div>
      <div class="modal-actions" style="margin-top:10px;">
        <button class="btn-ghost" id="enable-pet" style="flex:1;">🐟 开启桌宠悬浮窗</button>
        <button class="btn-ghost" id="collapse-pet" style="flex:1;display:none;">缩回桌宠</button>
      </div>
    </div>
  </div>

  const chatBox=document.getElementById('chat-box'),input=document.getElementById('user-input'),btn=document.getElementById('send-btn'),modalMask=document.getElementById('modal-mask'),keyInput=document.getElementById('key-input'),backupInfo=document.getElementById('backup-info');
  function freshHistory(){return[{role:'system',content:SYSTEM}]}
  let history=freshHistory(),busy=false;
